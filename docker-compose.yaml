services:
  minecraft-guardian:
    build: .
    container_name: minecraft-guardian
    ports:
      - "25565:25565" # Minecraft Server
      - "3000:3000"   # API Control
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./config:/app/config
    environment:
      - API_PORT=3000
    restart: unless-stopped
